<section>
    <h2>My Projects</h2>
    <div *ngFor="let project of Projects">
        <h3>{{ project.title }}</h3>
        <p>{{ project.description }}</p>
        <ul>
            <li *ngFor="let tech of project.technologies">
                {{ tech }}
            </li>
        </ul>
        <a [href]="project.link" target="_blank">View Project</a>
    </div>
</section>
